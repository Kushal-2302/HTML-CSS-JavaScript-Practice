<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Timimg Functions</h1>

    <button onclick="x = setTimeout(start,3000)">start</button>
    <button onclick="clearTimeout(x)">stop</button>
    <hr>
    <button onclick="x = setInterval(start,1000)">start</button>
    <button onclick="clearInterval(x)">stop</button>
    <hr>
    <button onclick="print()">start print</button>
    <button onclick="clearInterval(print)">stop print</button>

    <button onclick="startCountdown(10)">start countDown</button>
    


    <script src="./script.js"></script>
</body>
</html>
